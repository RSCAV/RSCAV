name: build the world

# The profile redraws itself from live GitHub data every morning and commits
# the result, so the README never depends on a third-party image service and
# never gets stale-cached behind an image proxy.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC, a few minutes off the hour so it is not queued with everyone else
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/build-world.yml'

permissions:
  contents: write

concurrency:
  group: build-world
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fonttools
        run: pipx install fonttools[woff] || pip install --user 'fonttools[woff]'

      - name: Build
        working-directory: engine
        env:
          # A repo-scoped GITHUB_TOKEN cannot see private contributions, which
          # is nearly all of them - the build would draw an empty city and
          # commit it. PROFILE_TOKEN is a fine-grained PAT with read:user.
          # build.mjs fails the job rather than commit a hollowed-out world.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node build.mjs

      - name: Commit if the world changed
        run: |
          git config user.name  "Rodrigo Casanova-Aleman"
          git config user.email "rscav06@gmail.com"
          git add assets/gen README.md
          if git diff --staged --quiet; then
            echo "nothing changed today"
            exit 0
          fi
          git commit -m "chore: rebuild the world $(date -u +%Y-%m-%d)"
          git push
