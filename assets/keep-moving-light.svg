<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Keep moving.">
  <style>
    @font-face { font-family: "Mona Sans"; font-weight: 600; src: url(data:font/woff;base64,) format("woff"); }
    .t { font-family: "Mona Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 64px; letter-spacing: -1.6px; fill: #1f2328; }
    .swim { animation: swim 22s linear -10s infinite; }
    .bob { animation: bob 2.6s ease-in-out infinite alternate; }
    @keyframes swim { from { transform: translateX(-120px); } to { transform: translateX(1260px); } }
    @keyframes bob { from { transform: translateY(2px); } to { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .swim { animation: none; transform: translateX(880px); }
      .bob { animation: none; }
    }
  </style>
  <defs><clipPath id="surface"><rect x="-200" y="0" width="1600" height="180"/></clipPath></defs>
  <text class="t" x="0" y="92">Keep moving.</text>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#d1d9e0" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#surface)">
    <g class="swim">
      <g class="bob">
        <path d="M 70,0 C 63,-26 44,-56 18,-70 C 23,-44 18,-17 0,0 Z" transform="translate(0,180)" fill="#1f2328"/>
      </g>
    </g>
  </g>
</svg>
